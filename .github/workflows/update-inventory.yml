name: Update Package Inventory

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Composer package name (e.g. laragear/webcheckout)'
        required: true
        type: string
      version:
        description: 'Bare semver version (no v prefix, e.g. 1.2.3)'
        required: true
        type: string
      dist_url:
        description: 'Keygen artifact redirect URL for this version'
        required: true
        type: string
      action:
        description: '"add" to upsert, "remove" to delete'
        required: true
        type: string
    # No secrets: block — callers use "secrets: inherit" so SATIS_DEPLOY_TOKEN
    # is available implicitly without triggering the "required" validation error.

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Laragear/Satis
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Laragear/Satis
          token:      ${{ secrets.SATIS_DEPLOY_TOKEN }}
          ref:        main

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Run inventory update
        run: |
          node scripts/update-satis.mjs \
            "${{ inputs.action }}" \
            "${{ inputs.package_name }}" \
            "${{ inputs.version }}" \
            "${{ inputs.dist_url }}"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add satis.json
          if git diff --cached --quiet; then
            echo "satis.json unchanged — nothing to commit."
          else
            git commit -m "chore(${{ inputs.action }}): ${{ inputs.package_name }}@${{ inputs.version }}"
            git push
          fi
