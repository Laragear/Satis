name: Update Package Inventory

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Composer package name, e.g. "laragear/webcheckout"'
        required: true
        type: string
      version:
        description: 'Bare semver version, e.g. "1.2.3" (no v prefix)'
        required: true
        type: string
      dist_url:
        description: 'Keygen artifact redirect URL for this version'
        required: true
        type: string
      action:
        description: '"add" to upsert, "remove" to delete'
        required: true
        type: string
    secrets:
      SATIS_DEPLOY_TOKEN:
        description: >
          Fine-grained PAT with Contents read/write on Laragear/Satis.
          Must be a PAT — GITHUB_TOKEN pushes do not trigger downstream workflows.
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Laragear/Satis
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Laragear/Satis
          token:      ${{ secrets.SATIS_DEPLOY_TOKEN }}
          ref:        main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Run inventory update
        run: |
          node scripts/update-satis.mjs \
            "${{ inputs.action }}" \
            "${{ inputs.package_name }}" \
            "${{ inputs.version }}" \
            "${{ inputs.dist_url }}"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add satis.json
          if git diff --cached --quiet; then
            echo "satis.json unchanged — nothing to commit."
          else
            git commit -m "chore(${{ inputs.action }}): ${{ inputs.package_name }}@${{ inputs.version }}"
            git push
          fi
