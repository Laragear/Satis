name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'satis.json'      # only rebuild when the package index actually changes
  workflow_dispatch:       # allow manual rebuilds

permissions:
  contents: write          # peaceiris/actions-gh-pages needs to push to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Build packages.json
        run: node scripts/build.mjs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token:    ${{ secrets.GITHUB_TOKEN }}
          publish_dir:     ./web
          publish_branch:  gh-pages
          commit_message:  'deploy: rebuild packages.json'
          # Prevent GitHub Pages from running Jekyll on the output
          enable_jekyll:   false
