name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'satis.json'      # only rebuild when the package index actually changes
  workflow_dispatch:       # allow manual rebuilds

permissions:
  contents: write          # peaceiris/actions-gh-pages needs to push to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Build packages.json
        run: node scripts/build.mjs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token:    ${{ secrets.GITHUB_TOKEN }}
          publish_dir:     ./web
          publish_branch:  gh-pages
          commit_message:  'deploy: rebuild packages.json'
          # Prevent GitHub Pages from running Jekyll on the output
          enable_jekyll:   false
